services:
  # =========================================================================
  # Core Application
  # =========================================================================
  monitor-system:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/urbaniakmichal/monitor-system:latest
    container_name: monitor-system
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    restart: unless-stopped
    environment:
      - PORT=${PORT:-8080}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 16M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${PORT:-8080}/health",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

  # =========================================================================
  # Telemetry & Monitoring Stack (Metrics)
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  # =========================================================================
  # ELK Stack (Logs & Analytics)
  # =========================================================================

  # Elasticsearch: Distributed search and analytics engine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  # Kibana: Visualization UI for Elasticsearch logs
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    volumes:
      - kibana_data:/usr/share/kibana/data
    restart: unless-stopped
    depends_on:
      - elasticsearch

# Named persistent volumes for data retention across container restarts
volumes:
  grafana_data:
  prometheus_data:
  elasticsearch_data:
  kibana_data:
